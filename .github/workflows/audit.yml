name: Scheduled dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-dependency-audit
  cancel-in-progress: true

jobs:
  rust-policy:
    name: Rust vulnerability and dependency policy
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-shear@1.13.4
          fallback: none
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories bans licenses sources
      - run: cargo shear

  secret-history:
    name: Repository secret history
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The same pinned, checksum-verified binary and explicit config `ci.yml` scans history with.
      # The gitleaks action bundles an older engine (8.24.3) and ran without `--config`, so it
      # reported the allowlisted cargo-mutants cache key in the first public commit on every run.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the checked-out history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1
