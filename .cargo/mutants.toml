# cargo-mutants configuration (cargo-mutants 27.1.0).
#
# The gate that consumes the output is `scripts/check/check-mutation-score.mjs`; the schedule is
# `.github/workflows/mutants.yml`. Read those two together with this file -- the score is only
# meaningful alongside the scope it was measured over, and the scope lives in the workflow, not
# here, deliberately (see "Scope is not expressed here" below).
#
# ## Tree handling
#
# `copy_target = false` is not a tuning choice, it is a hard requirement on this repository:
# `target/debug` is 6.3 GB of oxc artifacts and the development machine had 9.0 GB free when this
# was written. Copying it once would nearly fill the disk; copying it per parallel job would fill
# it. The cost is one cold build of the oxc tree per job, which is minutes -- paid once, not per
# mutant, because cargo-mutants reuses each job's build directory across mutants.
#
# `gitignore = true` keeps the 1.1 GB of `fixtures/` clones and `mutants.out/` out of the copy.
#
# `copy_vcs` stays `true` -- cargo-mutants defaults it to `false`. No current test needs it: the
# suites that read this checkout's `.git` (the docs-contract test lists tracked pages with
# `git ls-files`) no longer run under the unittest selection below, and the `git` calls left in
# `src/main.rs`'s tests initialize their own fixture repositories. It is kept as cheap insurance
# for the next test that does shell out against the checkout -- ~150 MB once per run, and the
# alternative is a baseline that fails with exit 4, which the gate refuses to score.
#
# ## Timeouts
#
# `minimum_test_timeout` is 60s against a warm baseline suite that finishes in ~6s under the
# unittest selection above (it was ~30s under `--all-targets`; the last baseline under that
# selection auto-set 111s). That headroom is for the copied tree's first run on a loaded CI box,
# not for slow tests.
#
# `build_timeout_multiplier = 12.0` is **not** cargo-mutants' default of 3.0, and the reason is
# recorded because the number was earned. At 3.0 the first full run of this scope auto-set a 77s
# build timeout from a 25s baseline build, and two mutants -- `emit_parameterization_candidate`
# and `emit_cross_file_duplicate` in `src/analysis.rs` -- timed out at 77.7s in the **Build** phase
# while another process on the machine was compiling. Neither is a hang: a build timeout says
# nothing whatever about the tests, but cargo-mutants reports it in the same `timeout` bucket as a
# test that never terminated, and `check-mutation-score.mjs` refuses a report with any timeout in
# it. A tight build timeout therefore does not measure anything -- it converts machine load into a
# failed gate. 12.0 gives ~300s against a 25s baseline, which is slack for contention without
# being slack for a genuine infinite loop (the suite itself is held to `minimum_test_timeout`).
#
# A timed-out mutant is an *unknown*, not a caught one, and `check-mutation-score.mjs` rejects any
# report containing one rather than counting it either way. That is load-bearing here specifically:
# `frontend/fingerprint.rs` carries recursion depth guards, and a mutant that removes one can hang
# instead of failing. If that happens, the right answer is a test that pins the guard's behaviour,
# not a score that quietly credits the timeout.
#
# ## `additional_cargo_test_args = ["--lib", "--bins"]`
#
# The per-mutant test run executes the lib unittest binary and the `src/main.rs` unittest binary,
# and nothing else. The evidence is the 2026-10-24 hosted run (767 of 1,537 mutants completed
# before the cap cancelled it): its per-mutant logs name the failing test, and all 513 caught
# mutants were caught by one of the two unittest binaries -- 503 by the lib binary alone, 10 by
# the `src/main.rs` binary alone, none by any of the 24 integration suites in `tests/`. That
# run still selected every target, so the suites were executed whenever nothing failed earlier
# -- cargo stops at the first failing test binary, which means on the baseline and on every
# missed mutant -- and every suite passed on each of them. Each of those mutants therefore
# classifies identically under this selection too: a unittest binary still fails first, or
# everything still passes, and the build phase is untouched. That is a statement about the
# recorded sample, not about the evidence future runs will carry -- from now on the mutation
# run itself provides none about the integration suites, which is the residual risk recorded
# below. Paired runs over the smallest scoped file (`fingerprint/row_substitution.rs`, 10
# mutants) confirm the classification identity directly: 6 caught, 0 missed, 4 unviable under
# both selections.
#
# What the selection buys is the test phase, and only its uncapped tail: a caught mutant stops
# in one of the two unittest binaries either way (7.1s vs 8.9s average test phase in the paired
# runs, noise), but
# a missed mutant runs the whole selection, and the full suite measures 33.1s against 5.6s for
# lib+bins on the development machine; the unmutated baseline each run starts from drops from
# 20s to 7s of test time. That is real but not a fix for the cap: the per-mutant build phase,
# which still compiles and links all 24 suites, is the larger half of the run, and cargo-mutants
# 27.1.0 gives `additional_cargo_test_args` to the test phase only (`src/cargo.rs`
# `cargo_argv`). `additional_cargo_args` does reach the build phase and was tried -- with it the
# unmutated baseline fails: a narrowed build never produces the standalone binary, and
# `CARGO_BIN_EXE_vitest-dedup`, the env var the `assert_cmd` calls in `src/main.rs` resolve it
# from, is unset, so 70 end-to-end tests panic before they run a step. The build-phase narrowing
# is therefore recorded here as tried and rejected, and the cap decision (sharding, more jobs, a
# higher cap) remains a separate one.
#
# Two boundaries are recorded rather than discovered later. The build phase still compiles
# every suite, so a mutant that breaks an integration suite's compilation still fails the build
# and scores unviable exactly as before -- the unviable/missed boundary does not move (in the
# hosted sample all 31 unviable mutants failed to compile the lib itself, none an integration
# suite). The residual risk that a future mutant is caught only by an integration suite is
# absorbed the same way the floors absorb equivalent mutants: the suites keep running in CI
# itself, and the floors in `scripts/check/check-mutation-score.mjs` are re-measured under this
# selection when the first full run completes. If the scope ever widens to files whose
# behaviour surfaces only through the CLI's rendered output (report paths, SARIF, terminal
# layout), revisit this selection with the same evidence standard.
#
# ## Exclusions: one, and it is not a coverage dodge
#
# The only exclusion is `src/analysis/tests.rs`, which is 2,928 lines of `#[cfg(test)]` unit tests
# that happen to live under `src/` rather than in `tests/`. cargo-mutants 27.1.0 already skips it
# (`cargo mutants --list` names 7,068 mutants as of 2026-10-24, 6,075 on 2026-10-18, none in that file), so today this line changes
# nothing. It is here so that a future cargo-mutants release cannot silently start mutating the
# test suite and scoring it against itself -- a mutant in a test body that no *other* test catches
# is not a finding about this project's code.
#
# Nothing else is excluded, and that is a decision rather than an omission. The two candidates
# were:
#
#   - **Doc comments.** cargo-mutants does not mutate them; there is nothing to exclude.
#   - **Unreachable defensive code** -- the depth guards in `fingerprint.rs`, the `degraded`
#     fallbacks, match arms that exist so the compiler proves the match total. An `exclude_re` for
#     those is refused for the reason `scripts/check/check-coverage.mjs` refuses a coverage
#     exclusion list: the list has to be maintained by whoever is trying to make the number go up,
#     and "this mutant is an equivalent mutant" is exactly the claim a reader cannot check from a
#     regex. Surviving defensive mutants are absorbed by the *floor* instead -- the floor was
#     measured with them surviving, so the gate never demands they be killed, only that the score
#     not get worse. Each survivor is then adjudicated by hand, one at a time, where a human can
#     be held to the claim that it is an equivalent mutant rather than an unconstrained behaviour.
#
# ## Scope is not expressed here
#
# There is no `examine_globs` in this file. A full run is 7,068 mutants (2026-10-24); the measured scope
# is 13 files. Putting that scope in the config would make `cargo mutants` silently mean
# "the scoped run" for every future invocation, including someone's exploratory run over a file
# they just changed. The scope lives in the workflow's `--file` flags, where it is visible next to
# the threshold it produced.
#
# ## Deviation from cuke-dedup
#
# cuke-dedup sets `profile = "mutants"` here and defines `[profile.mutants] inherits = "test",
# debug = "none"` in `Cargo.toml`. `Cargo.toml` is outside this change's ownership, and naming a
# profile that does not exist makes every cargo invocation fail, so the profile line is omitted and
# the same effect -- no debuginfo, which is most of that 6.3 GB and most of the link time -- is
# obtained from `CARGO_PROFILE_DEV_DEBUG=none CARGO_PROFILE_TEST_DEBUG=none` in the `mutants` npm
# script and in the workflow. A real `[profile.mutants]` in `Cargo.toml` is the better home, and
# setting one there is still outstanding work rather than a rejected idea.
#
# `all_features = true` is also omitted: this crate declares no `[features]`, so it would be a
# no-op that reads like a decision.
gitignore = true
copy_vcs = true
copy_target = false
minimum_test_timeout = 60.0
build_timeout_multiplier = 12.0
timeout_multiplier = 4.0
additional_cargo_test_args = ["--lib", "--bins"]
exclude_globs = ["src/analysis/tests.rs"]
